<defs><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c77dff"/><stop offset=".5" stop-color="#ff7ae6"/><stop offset="1" stop-color="#7cf3ff"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#ff7ae6"/><stop offset=".6" stop-color="#7b2cbf"/><stop offset="1" stop-color="#240046"/></radialGradient></defs>
<style>
.row{opacity:0;animation:in .7s ease-out forwards} @keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.ic{font:22px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif} .k{font:700 17px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#e0aaff;letter-spacing:.5px} .v{font:400 17px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#e6edf3}
.spin{animation:spin 8s linear infinite;transform-origin:190px 190px} @keyframes spin{to{transform:rotate(360deg)}}
.flt{animation:fl 3.6s ease-in-out infinite} @keyframes fl{50%{transform:translateY(-7px)}}
.pill{fill:#1b1036;stroke:#c77dff} .pt{font:600 12px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#f3e8ff;text-anchor:middle}
.ring{fill:none;stroke:#c77dff;stroke-opacity:.35;stroke-dasharray:4 8}
.ring2{animation:spin 14s linear infinite reverse;transform-origin:190px 190px}
.core{animation:beat 2.4s ease-in-out infinite;transform-origin:190px 190px} @keyframes beat{50%{transform:scale(1.08)}}
.ttl{font:800 30px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#fff} .tag{font:600 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#7cf3ff}
</style>
