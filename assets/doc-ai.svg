<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c77dff"/><stop offset=".5" stop-color="#ff7ae6"/><stop offset="1" stop-color="#c77dff" stop-opacity=".2"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="5s" begin="0.0s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#c77dff" stop-opacity=".35"/><stop offset="1" stop-color="#c77dff" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect x="2" y="2" width="576" height="246" rx="20"/></clipPath></defs>
<style>
.ttl{font:700 23px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#fff} .d{font:400 15.5px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#c9d1d9} .t{font:600 12.5px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#f0f6fc}
.lb{font:700 11px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#c77dff;letter-spacing:1.5px}
.blob{animation:drift 9s ease-in-out infinite} @keyframes drift{50%{transform:translate(-120px,40px)}}
.shine{animation:sh 5s 0.0s ease-in-out infinite;transform:translateX(-200px)} @keyframes sh{0%{transform:translateX(-200px)}35%,100%{transform:translateX(800px)}}
.ic{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
.arr{animation:nudge 1.6s ease-in-out infinite} @keyframes nudge{50%{transform:translateX(5px)}}
.in{opacity:0;animation:fi .8s 0.20s ease-out forwards} @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
<rect x="2" y="2" width="576" height="246" rx="20" fill="#0d1117"/>
<g clip-path="url(#cp)">
<circle cx="520" cy="40" r="170" fill="url(#gl)" class="blob"/>
<rect x="0" y="-50" width="60" height="400" fill="#ffffff" opacity=".05" transform="rotate(20)" class="shine"/>
</g>
<rect x="2" y="2" width="576" height="246" rx="20" fill="none" stroke="url(#g)" stroke-width="2.5"/>
<g class="in">
<text x="34" y="72" font-size="34" class="ic">📝</text>
<text x="86" y="68" class="ttl">Document Digitization AI</text>
<g transform="translate(458 28)"><rect width="88" height="24" rx="12" fill="#c77dff1f" stroke="#c77dff66"/><text x="44.0" y="16" class="lb" text-anchor="middle">FLAGSHIP</text></g>
<rect x="34" y="88" width="56" height="3" rx="2" fill="#c77dff"/>
<text x="34" y="128" class="d">Reads photos of handwritten — even cursive —</text>
<text x="34" y="152" class="d">notes and turns them into exam notes,</text>
<text x="34" y="176" class="d">summaries and flashcards.</text>
<g transform="translate(34 200)"><rect width="78" height="28" rx="14" fill="#c77dff22" stroke="#c77dff88"/><text x="39" y="19" class="t" text-anchor="middle">Gemini</text></g><g transform="translate(121.6 200)"><rect width="103" height="28" rx="14" fill="#c77dff22" stroke="#c77dff88"/><text x="52" y="19" class="t" text-anchor="middle">Streamlit</text></g><g transform="translate(235.0 200)"><rect width="69" height="28" rx="14" fill="#c77dff22" stroke="#c77dff88"/><text x="34" y="19" class="t" text-anchor="middle">GenAI</text></g>
<text x="540" y="220" class="arr" font-size="20" fill="#c77dff" text-anchor="end">→</text>
</g>
</svg>