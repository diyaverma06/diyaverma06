<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1f"/><stop offset=".55" stop-color="#1a0b3d"/><stop offset="1" stop-color="#2b0a4a"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#e0aaff"/><stop offset=".5" stop-color="#ff7ae6"/><stop offset=".65" stop-color="#7cf3ff"/><stop offset="1" stop-color="#ffffff"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0;-600 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="glow1"><stop offset="0" stop-color="#9d4edd" stop-opacity=".55"/><stop offset="1" stop-color="#9d4edd" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2"><stop offset="0" stop-color="#00d4ff" stop-opacity=".35"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
