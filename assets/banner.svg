<style>
.edge{stroke:#8b5cf6;stroke-opacity:.18;stroke-width:1.2}
.sig{stroke:#7cf3ff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:14 400;stroke-dashoffset:414;animation:flow linear infinite;filter:drop-shadow(0 0 4px #7cf3ff)}
@keyframes flow{to{stroke-dashoffset:0}}
.node{fill:#2a1458;stroke:#c77dff;stroke-width:2;animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);stroke:#c77dff}50%{transform:scale(1.35);stroke:#7cf3ff}}
.tw{animation:tw 3.5s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.hi{font:600 22px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#c77dff;opacity:0;animation:up .8s .2s ease-out forwards}
.nm{font:800 92px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:url(#name);letter-spacing:-2px;opacity:0;animation:up .9s .5s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.role{font:500 26px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#e9d5ff;opacity:0;animation:cyc 9s infinite}
.r1{animation-delay:3s} .r2{animation-delay:6s}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}5%,30%{opacity:1;transform:none}35%,100%{opacity:0;transform:translateY(-10px)}}
.cur{fill:#7cf3ff;animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.chip{fill:#ffffff10;stroke:#c77dff66} .chipt{font:500 15px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#f3e8ff}
.bar{animation:grow 1.2s 1s ease-out forwards;transform:scaleX(0);transform-origin:left;transform-box:fill-box} @keyframes grow{to{transform:scaleX(1)}}
.orb{animation:float 7s ease-in-out infinite} @keyframes float{50%{transform:translate(30px,-20px)}}
</style>
